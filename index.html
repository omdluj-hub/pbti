<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>피부 MBTI 테스트</title>
    <!-- Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>
    <script>
      // SDK 로딩 확인용 디버깅
      (function() {
        var checkCount = 0;
        var checker = setInterval(function() {
          checkCount++;
          if (window.Kakao) {
            console.log('✅ Kakao SDK Loaded Successfully (Attempt ' + checkCount + ')');
            clearInterval(checker);
          } else if (checkCount > 50) {
            console.error('❌ Kakao SDK Load Timeout');
            clearInterval(checker);
          }
        }, 100);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
